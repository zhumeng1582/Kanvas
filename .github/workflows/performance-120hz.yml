name: Strict 120Hz device matrix

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  macrobenchmark:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'performance-120hz'
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: qualcomm-flagship-120
            runner: android-perf-qualcomm-flagship-120
          - device: qualcomm-mainstream-120
            runner: android-perf-qualcomm-mainstream-120
          - device: mediatek-mainstream-120
            runner: android-perf-mediatek-mainstream-120
    runs-on: [self-hosted, android-perf, "${{ matrix.runner }}"]
    timeout-minutes: 45
    concurrency:
      group: kanvas-120hz-${{ matrix.device }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify one 120Hz device
        shell: bash
        run: |
          test "$(adb devices | awk 'NR>1 && $2 == "device" { count++ } END { print count+0 }')" -eq 1
          adb shell settings put system peak_refresh_rate 120.0
          adb shell settings put system min_refresh_rate 120.0
          adb shell dumpsys display | grep -E 'mActiveRenderFrameRate|refreshRate|supportedModes' | grep -E '120(\.0+)?'
      - name: Run 100k interaction Macrobenchmarks
        run: >-
          ./gradlew :benchmark:connectedBenchmarkAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.class=com.zhumeng.kanvas.benchmark.KanvasMacrobenchmark
      - name: Enforce strict P95/P99 and Overrun gates
        run: >-
          python3 tools/check_macrobenchmark_thresholds.py
          --results benchmark/build/outputs/androidTest-results/connected/benchmark
          --profile strict-120hz
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: kanvas-120hz-${{ matrix.device }}
          path: |
            benchmark/build/outputs/androidTest-results/connected/benchmark
            benchmark/build/outputs/connected_android_test_additional_output/benchmark
